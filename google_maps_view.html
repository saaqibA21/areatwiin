<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Maps 3D Vector & Satellite Twin</title>
<style>
  html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  #hud { position: absolute; top: 15px; left: 15px; z-index: 99; background: rgba(5,10,25,0.9); color: #fff; padding: 12px 18px; border-radius: 8px; font-family: sans-serif; font-size: 13px; border: 1px solid #38bdf8; }
</style>
</head>
<body>
<div id="hud">
  <b style="color:#38bdf8">Google Maps Photorealistic Satellite View</b><br>
  Royapuram, Chennai (13.1040° N, 80.2937° E)<br>
  <span style="font-size:11px;color:#fcd34d">3D Tilt: 60° | Heading: 45°</span>
</div>
<div id="map"></div>
<script>
function initMap() {
  const royapuram = { lat: 13.1040, lng: 80.2937 };
  const map = new google.maps.Map(document.getElementById("map"), {
    center: royapuram,
    zoom: 17,
    tilt: 60,
    heading: 45,
    mapTypeId: "satellite",
    mapId: "DEMO_MAP_ID"
  });

  // Marker for Royapuram Station
  new google.maps.Marker({
    position: { lat: 13.1065, lng: 80.2920 },
    map: map,
    title: "Royapuram Railway Station (1856)"
  });

  // Marker for Kasimedu Fishing Harbour
  new google.maps.Marker({
    position: { lat: 13.1115, lng: 80.2965 },
    map: map,
    title: "Kasimedu Fishing Harbour"
  });
}
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBFzf4K4xzSL2bgBoGUgFUfHY6DxFwa7Ks&v=beta&callback=initMap"></script>
</body>
</html>
